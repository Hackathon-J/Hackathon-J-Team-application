<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <title>RareTECH学習サポートアプリ(仮)</title>
</head>
<body>
    <header>
        <!-- アプリ上部のヘッダーを表示 -->
        <!-- いずれもaタグにしてリンクにする予定？ -->
        <!--　左上にアプリ名 -->
        <h3>RareTECH学習サポートアプリ(仮)</h3>
        <!-- 右上にナビゲーション-->
        <nav>
            <a href="{{ url_for('home') }}">ホーム</a>
            <a href="{{ url_for('profile') }}">プロフィール</a>
            <a href="{{ url_for('logout') }}">ログアウト</a>
        </nav>
    </header>
    <main>
        {% if posts and posts | length > 0 %}
        <div class="post-list">
            {% for post in posts %}
            <div class="post-card">
                <img src="{{ url_for('static' , filename='icon/profile_icon.png') }}" class="profile-img">
                <div class="post-content">
                    <div class="post-header">
                        <div class="post-user">
                            {{ post.author.username }}
                        </div>
                        <div class="post-time">
                            {{ post.created_at.strftime('%Y-%m-%d %H:%M') }}
                        </div>
                    </div>
                    <div class="post-body">
                    {{ post.content }}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="empty">
            <p>投稿がありません。</p>
        </div>
        {% endif %}
        <form action="{{ url_for('post') }}" method="POST">
            <button class="post-button" type="submit">投稿を作成</button>  
        </form>
    </main>
    
</body>
</html>
