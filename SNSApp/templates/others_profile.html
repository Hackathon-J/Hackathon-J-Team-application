<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/others_profile.css') }}">
    <link rel="stylesheet" href="../static/css/others_profile.css"> <!--Flask連携前確認用の為、この行確認後削除-->
    <title>others-profile-RareTECH学習サポートアプリ(仮)</title>
</head>
<body>
    <header>
        <!-- アプリ上部のヘッダーを表示 -->
        <!-- いずれもaタグにしてリンクにする予定？ -->
        <!--　左上にアプリ名 -->
        <h3>RareTECH学習サポートアプリ(仮)</h3>
        <!-- 右上にナビゲーション-->
        <nav>
            <a href="{{ url_for('home') }}">ホーム</a>
            <a href="{{ url_for('profile') }}">プロフィール</a>
            <a href="{{ url_for('logout') }}">ログアウト</a>
        </nav>
    </header>
    <main>
        <img class="profile-img" src="../static/css/icon/profile_icon.png" alt="写真設定なし" title="プロフィール初期画像" width="206px" height="206px">

        <div class="profile-user">
            {{ post.user_name }}
        </div>
        
        <div class="profile-body" style="overflow-y: scroll;">
            <!--{{ post.profile_content }} バックエンドのデータ繁反映させる-->
            {{ post.bio }}
        </div>
    </main>
    
</body>
</html>
