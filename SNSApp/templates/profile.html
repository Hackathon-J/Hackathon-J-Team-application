<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
    <link rel="stylesheet" href="../static/css/profile.css"> <!--Flask連携前確認用の為、この行確認後削除-->
    <title>profile-RareTECH学習サポートアプリ(仮)</title>
</head>
<body>
    <header>
        <!-- アプリ上部のヘッダーを表示 -->
        <!-- いずれもaタグにしてリンクにする予定？ -->
        <!--　左上にアプリ名 -->
        <h3>RareTECH学習サポートアプリ(仮)</h3>
        <!-- 右上にナビゲーション-->
        <nav>
             <a href="{{ url_for('home') }}">ホーム</a>
            <a href="{{ url_for('profile') }}">プロフィール</a>
            <a href="{{ url_for('logout') }}">ログアウト</a>
        </nav>
    </header>
    <main>
        <img class="profile-img" src="../static/css/icon/profile_icon.png" alt="写真設定なし" title="プロフィール初期画像" width="206px" height="206px">

        <div class="profile-user">
            {{ post.user_name }}
        </div>
        <!-- プロフィール記入欄と保存ボタン -->
        <div class="profile-body">
            <!-- profileルートに飛ぶ -->
            <form action="{{ url_for('profile') }}" method="POST">
                <!-- プロフィール記入欄 -->
                <textarea name="profile_content" placeholder="自己紹介を自由に書きましょう！" style="overflow-y: scroll;">{{ post.profile.content if post.profile else '' }}</textarea>
                <!-- 保存ボタン -->
                <div class="save-button-area">
                    <input type="submit" value="プロフィールを保存" class="save-button">
                </div>
            </form>
        </div>
    </main>
    
</body>
</html>
