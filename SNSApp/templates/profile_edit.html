<!-- base.htmlを継承 -->
{% extends "base.html" %}
<!-- ページごとに必要なcssを追加 -->
{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/profile_edit.css') }}">
{% endblock %}

{% block content %}
<main class="profile-container">
    <!-- アイコン画像表示 -->
    <div class="profile-icon-area">
        {% set size = "large" %}
        {% include "icon.html" %}
    </div>

        <!-- 編集フォーム -->
    <form action="{{ url_for('profile_edit') }}"
        method="POST"
        enctype="multipart/form-data"
        class="profile-edit-form">

        <!-- ファイル選択ボタン -->
        <label class="file-label">
                <input type="file" name="icon" accept="image/*">
        </label>
        
        <!-- ユーザー名 -->
            <input type="text" 
                name="username"
                class="profile-username-input" 
                value="{{ target_user.username }}" >

        <!-- プロフィール文 -->
        <textarea name="content" 
                    class="profile-textarea"
                    placeholder="自己紹介を自由に書きましょう！" 
                    style="overflow-y: scroll;">{{ target_user.profile.content }}</textarea>

        <!-- まとめて保存 -->
        <button type="submit" class="save-button">登録</button>
        <a href="{{ url_for('profile') }}" class="cancel-button"> キャンセル </a>
    </form>
</main>
</body>
{% endblock %}
