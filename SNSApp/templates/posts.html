<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="posts.css" >
    <title>RareTECH学習サポートアプリ(仮)</title>
</head>
<body>
    <header>
        <!-- アプリ上部のヘッダーを表示 -->
        <!--　左上にアプリ名 -->
        <h3>RareTECH学習サポートアプリ(仮)</h3>
        <!-- 右上にナビゲーション-->
        <nav>
            <a>ホーム</a>
            <a>プロフィール</a>
            <a>ログアウト</a>
        </nav>
    </header>
    <main>
        <!-- 投稿欄の作成　-->
        <form class="post">
            <textarea id="input_post" name="post_body"  placeholder="今日の学習内容を記入してください"></textarea>
            <div id="input_post_button">
                <input type="submit" value="送信">
            </div>
        </form>
    </main>
    
</body>
</html>
