{% macro profile_link(user, current_user, size="small") %}
    {% if user.id == current_user.id %}
        {% set target_user = user %}
        {% include "icon.html" %}
    {% else %}
        <a href="{{ url_for('others_profile', user_id=user.id) }}" class="profile-link">
            {% set target_user = user %}
            {% include "icon.html" %}
        </a>
    {% endif %}
{% endmacro %}
